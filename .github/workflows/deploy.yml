name: Deploy (manual)
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Apply database migrations (direct Neon connection, forward-only, checksum-locked)
        run: npm run migrate
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
      - name: Deploy Worker
        run: npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
