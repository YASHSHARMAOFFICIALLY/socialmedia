name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test              # in-process Postgres (PGlite) + mocked platform APIs: no secrets, no network
      - run: npx wrangler deploy --dry-run --outdir dist   # the Worker must bundle
